<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Compromiso y velocidad académica simulada</title><desc id="desc">Cuatro sprints de 7, 7, 8 y 5 SP planificados y simulados terminados. Media simulada 6,75 SP/sprint. Sin velocidad real.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif"><text x="70" y="48" font-size="30" fill="#172033" text-anchor="start" font-weight="bold">FDMLP · Compromiso y velocidad simulada</text><text x="70" y="80" font-size="21" fill="#172033" text-anchor="start" font-weight="normal">Escenario de cumplimiento completo · media simulada: 6,75 SP/sprint</text><rect x="70" y="94" width="435" height="38" fill="#FFF0C2" rx="6"/><text x="86" y="121" font-size="23" fill="#713F12" text-anchor="start" font-weight="bold">SIMULACIÓN ACADÉMICA</text><line x1="120" y1="500.0" x2="1020" y2="500.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="507.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">0</text><line x1="120" y1="435.0" x2="1020" y2="435.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="442.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">2</text><line x1="120" y1="370.0" x2="1020" y2="370.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="377.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">4</text><line x1="120" y1="305.0" x2="1020" y2="305.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="312.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">6</text><line x1="120" y1="240.0" x2="1020" y2="240.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="247.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">8</text><line x1="120" y1="175.0" x2="1020" y2="175.0" stroke="#CBD5E1" stroke-width="1"/><text x="102" y="182.0" font-size="20" fill="#172033" text-anchor="end" font-weight="normal">10</text><line x1="120" y1="175" x2="120" y2="500" stroke="#475569" stroke-width="2"/><line x1="120" y1="500" x2="1020" y2="500" stroke="#475569" stroke-width="2"/><text transform="translate(35 340) rotate(-90)" text-anchor="middle" font-size="22" fill="#172033">Story points por sprint</text><rect x="169" y="272.5" width="52" height="227.5" fill="#1D4ED8" rx="3"/><text x="195" y="260.5" font-size="22" fill="#1D4ED8" text-anchor="middle" font-weight="bold">7</text><rect x="239" y="272.5" width="52" height="227.5" fill="#B45309" rx="3"/><text x="265" y="260.5" font-size="22" fill="#B45309" text-anchor="middle" font-weight="bold">7</text><text x="230" y="540" font-size="22" fill="#172033" text-anchor="middle" font-weight="normal">Sprint 1</text><rect x="394" y="272.5" width="52" height="227.5" fill="#1D4ED8" rx="3"/><text x="420" y="260.5" font-size="22" fill="#1D4ED8" text-anchor="middle" font-weight="bold">7</text><rect x="464" y="272.5" width="52" height="227.5" fill="#B45309" rx="3"/><text x="490" y="260.5" font-size="22" fill="#B45309" text-anchor="middle" font-weight="bold">7</text><text x="455" y="540" font-size="22" fill="#172033" text-anchor="middle" font-weight="normal">Sprint 2</text><rect x="619" y="240.0" width="52" height="260.0" fill="#1D4ED8" rx="3"/><text x="645" y="228.0" font-size="22" fill="#1D4ED8" text-anchor="middle" font-weight="bold">8</text><rect x="689" y="240.0" width="52" height="260.0" fill="#B45309" rx="3"/><text x="715" y="228.0" font-size="22" fill="#B45309" text-anchor="middle" font-weight="bold">8</text><text x="680" y="540" font-size="22" fill="#172033" text-anchor="middle" font-weight="normal">Sprint 3</text><rect x="844" y="337.5" width="52" height="162.5" fill="#1D4ED8" rx="3"/><text x="870" y="325.5" font-size="22" fill="#1D4ED8" text-anchor="middle" font-weight="bold">5</text><rect x="914" y="337.5" width="52" height="162.5" fill="#B45309" rx="3"/><text x="940" y="325.5" font-size="22" fill="#B45309" text-anchor="middle" font-weight="bold">5</text><text x="905" y="540" font-size="22" fill="#172033" text-anchor="middle" font-weight="normal">Sprint 4</text><line x1="120" y1="280.625" x2="1020" y2="280.625" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/><text x="570" y="579" font-size="21" fill="#172033" text-anchor="middle" font-weight="normal">Sprint académico simulado</text><rect x="95" y="612" width="24" height="18" fill="#1D4ED8" rx="0"/><text x="130" y="629" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">Compromiso</text><rect x="360" y="612" width="24" height="18" fill="#B45309" rx="0"/><text x="395" y="629" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">Terminados simulados</text><line x1="760" y1="622" x2="810" y2="622" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/><text x="820" y="629" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">Media: 6,75</text><text x="70" y="669" font-size="19" fill="#172033" text-anchor="start" font-weight="normal">Velocidad real no disponible. Los resultados simulados no miden productividad real.</text></g></svg>