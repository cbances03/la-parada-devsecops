name: Deploy authorized preview
on:
  workflow_dispatch:
    inputs:
      authorized:
        description: 'I am authorized to deploy this commit to the configured Vercel project'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: vercel-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.authorized && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      # Global installs do not read the project's .npmrc.
      - run: npm install --global vercel@65.14.0 --legacy-peer-deps --no-audit --no-fund
      - name: Deploy preview to existing authorized project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"
